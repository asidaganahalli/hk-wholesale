# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.166.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' content themes/faster/layouts; then
            echo "Unresolved merge-conflict markers found in site source."
            exit 1
          fi

          hugo --cleanDestinationDir --minify

          test -s public/privacy/index.html
          test -s public/sms-terms/index.html
          grep -q "Privacy Policy" public/privacy/index.html
          grep -q "SMS Terms" public/sms-terms/index.html
          grep -q "temporarily unavailable" public/contact/index.html
          grep -q "mailto:hkwholesalenj@gmail.com" public/contact/index.html
          grep -E -q 'tel:([+]|&#43;)17323065096' public/contact/index.html
          if grep -q "ZgotmplZ" public/contact/index.html; then
            echo "Unsafe link placeholder found on the contact page."
            exit 1
          fi
          test -s public/site.webmanifest
          test -s public/img/Hk-WholesaleLogo_New.jpeg
          test -s public/img/SnowMeltSalt.jpg
          test -s public/img/Sustainability.jpg
          test -s public/img/icons/apple-touch-icon.png
          test -s public/img/icons/icon-192.png
          test -s public/img/icons/icon-512.png
          grep -E -q '"display"[[:space:]]*:[[:space:]]*"standalone"' public/site.webmanifest
          grep -E -q 'data-mobile-tab="?logistics"?' public/index.html
          grep -E -q 'href="?/services/#logistics-services"?' public/index.html
          grep -E -q 'src="?/img/Hk-WholesaleLogo_New.jpeg' public/index.html
          grep -q "img/SnowMeltSalt.jpg" public/services/index.html
          grep -q "img/Sustainability.jpg" public/services/index.html
          grep -q "https://hk-wholsale.com/" public/index.html
          if grep -R -i -n -E 'HTML Codex|htmlcodex\.com' public --include='*.html'; then
            echo "Outdated HTML Codex attribution found in generated pages."
            exit 1
          fi
          test ! -e public/mail/contact.php
          if grep -q "smsConsent" public/contact/index.html; then
            echo "SMS consent must not be offered before a working enrollment service exists."
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    env:
      PAGES_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - name: Verify policy pages over HTTPS
        run: |
          if [[ "$PAGES_URL" != https://* ]]; then
            echo "::error::GitHub Pages is not serving this deployment over HTTPS (reported URL: $PAGES_URL)."
            echo "::error::Check the custom-domain DNS and GitHub Pages certificate status, then enable Enforce HTTPS in repository Settings > Pages."
            exit 1
          fi

          pages_url="${PAGES_URL%/}"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 10 \
            "$pages_url/privacy/" \
            --output privacy.html
          curl --fail --silent --show-error --location --retry 12 --retry-delay 10 \
            "$pages_url/sms-terms/" \
            --output sms-terms.html

          grep -qi "Privacy Policy" privacy.html
          grep -qi "SMS Terms" sms-terms.html
