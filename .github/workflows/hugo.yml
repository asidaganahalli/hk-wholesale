# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.148.0
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' content themes/faster/layouts; then
            echo "Unresolved merge-conflict markers found in site source."
            exit 1
          fi

          hugo --cleanDestinationDir --minify

          test -s public/privacy/index.html
          test -s public/sms-terms/index.html
          grep -q "Privacy Policy" public/privacy/index.html
          grep -q "SMS Terms" public/sms-terms/index.html
          grep -q "STOP" public/sms-terms/index.html
          grep -q "HELP" public/sms-terms/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify policy pages on the public domain
        run: |
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 \
            https://hk-wholsale.com/privacy/ \
            --output privacy.html
          curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 10 \
            https://hk-wholsale.com/sms-terms/ \
            --output sms-terms.html

          grep -qi "Privacy Policy" privacy.html
          grep -qi "SMS Terms" sms-terms.html
