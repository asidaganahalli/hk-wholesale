<div class="row pb-3"></div>
{{ range hugo.Data.services.product_services.categories }}
{{ $sectionID := cond (eq .title "Product Categories") "product-categories" "logistics-services" }}
<div class="container services p-2">
    <h3 class="py-2" id="{{ $sectionID }}">{{ .title }}</h3>
    <div class="row gy-4">
        {{ range .items }}
        <div class="col-lg-4 col-md-6 mb-4">
            <article class="product-service-card h-100">
                {{ if .image }}
                <figure class="product-service-photo">
                    <img src="{{ .image | relURL }}" alt="{{ .imageAlt }}" width="{{ .imageWidth | default 1200 }}" height="{{ .imageHeight | default 800 }}" loading="lazy">
                    <figcaption>{{ .imageCaption | default "Stock photo for illustration" }}</figcaption>
                </figure>
                {{ else }}
                <div class="product-service-icon" aria-hidden="true">
                    <i class="fa {{ .icon }}"></i>
                </div>
                {{ end }}
                <h4>{{ .name }}</h4>
                <p>{{ .description }}</p>
            </article>
        </div>
        {{ end }}
    </div>
</div>
{{ end }}
