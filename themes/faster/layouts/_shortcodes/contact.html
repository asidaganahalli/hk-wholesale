<div class="container-fluid py-5">
  <div class="container">
    <div class="row">
      <div class="col-lg-5 pb-4 pb-lg-0">
        <div class="bg-primary text-dark text-center p-4">
          <h4 class="m-0"><i class="fa fa-map-marker-alt text-white mr-2"></i>{{ .Site.Params.address.street }}, {{
            .Site.Params.address.city }}{{ .Site.Params.address.state }} {{ .Site.Params.address.zip }}</h4>
        </div>
        <iframe style="width: 100%; height: 470px;"
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3001156.4288297426!2d-78.01371936852176!3d42.72876761954724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4ccc4bf0f123a5a9%3A0xddcfc6c1de189567!2sNew%20York%2C%20USA!5e0!3m2!1sen!2sbd!4v1603794290143!5m2!1sen!2sbd"
          frameborder="0" style="border:0;" allowfullscreen="" aria-hidden="false" tabindex="0"></iframe>
      </div>
      <div class="col-lg-7">
          <h6 class="text-primary text-uppercase font-weight-bold">Contact Us</h6>
        <h1 class="mb-4">Contact For Any Queries</h1>
        <div class="contact-form bg-secondary" style="padding: 30px;">
          <div id="success"></div>
          <form name="sentMessage" id="contactForm" novalidate="novalidate">
            <div class="control-group">
              <input type="text" class="form-control border-0 p-4" id="name" placeholder="Your Name" required="required"
                data-validation-required-message="Please enter your name" />
              <p class="help-block text-danger"></p>
            </div>
            <div class="control-group">
              <input type="email" class="form-control border-0 p-4" id="email" placeholder="Your Email"
                required="required" data-validation-required-message="Please enter your email" />
              <p class="help-block text-danger"></p>
            </div>
              <div class="control-group">
                <input type="tel" class="form-control border-0 p-4" id="phone" placeholder="Phone (optional)"
                  autocomplete="tel" />
                <p class="help-block text-danger"></p>
              </div>
            <div class="control-group">
              <input type="text" class="form-control border-0 p-4" id="subject" placeholder="Subject"
                required="required" data-validation-required-message="Please enter a subject" />
              <p class="help-block text-danger"></p>
            </div>
            <div class="control-group">
              <textarea class="form-control border-0 py-3 px-4" rows="3" id="message" placeholder="Message"
                required="required" data-validation-required-message="Please enter your message"></textarea>
              <p class="help-block text-danger"></p>
            </div>
              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="smsConsent" />
                <label class="form-check-label" for="smsConsent">
                  I agree to receive up to 3 text messages from HK Wholesale about this inquiry. Message and data rates may apply. Reply STOP to opt out or HELP for help. Consent is not a condition of purchase. See our <a href="/sms-terms/">SMS Terms</a> and <a href="/privacy/">Privacy Policy</a>.
                </label>
              </div>
            <div>
              <button class="btn btn-primary py-3 px-4" type="submit" id="sendMessageButton">Send
                Message</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
