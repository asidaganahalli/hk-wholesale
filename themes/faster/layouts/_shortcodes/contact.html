<div class="container-fluid py-5">
  <div class="container">
    <div class="row">
      <div class="col-lg-8 mx-auto">
        <h2 class="mb-4">Talk with our team</h2>
        <div class="contact-form bg-secondary text-dark p-4">
          <p>Our online contact form is temporarily unavailable. Please contact us directly by phone or email about products, delivery, or your business needs.</p>
          <p><i class="fa fa-phone-alt mr-2"></i><a href="tel:{{ replaceRE "[^0-9+]" "" .Site.Params.contact.phone }}">{{ .Site.Params.contact.phone }}</a></p>
          <p class="mb-0"><i class="fa fa-envelope mr-2"></i><a href="mailto:{{ .Site.Params.contact.email }}">{{ .Site.Params.contact.email }}</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
