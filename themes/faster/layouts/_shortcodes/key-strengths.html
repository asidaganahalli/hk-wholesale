<h3>Key Strengths</h3>
<ul class="row list-unstyled" data-aos="fade-up" data-aos-delay="100">
    {{ range hugo.Data.about.key_strengths.strengths }}
    <li class="col-md-6 mb-4">
        <i class="{{ .icon }}" aria-hidden="true"></i>
        <div>
            <h5>{{ .title }}</h5>
            <p>{{ .description }}</p>
        </div>
    </li>
    {{ end }}
</ul>
