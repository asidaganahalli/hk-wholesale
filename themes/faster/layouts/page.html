{{ define "main" }}
<!-- Header Start -->
<div class="jumbotron jumbotron-fluid mb-5">
  <div class="container text-center py-5">
    <h1 class="text-white display-3">{{ .Title }}</h1>
  </div>
</div>
<!-- Header End -->
<div class="container-fluid py-5 px-lg-5 px-md-6">
  <div class="page-content mx-auto">
    {{ .Content | safeHTML }}
  </div>
</div>



{{ end }}
