    <!-- Topbar Start -->
    <div class="container-fluid bg-dark">
        <div class="row py-2 px-lg-5">
            <div class="col-12 text-center text-lg-left mb-2 mb-lg-0">
                <div class="d-inline-flex align-items-center text-white">
                    <small><i class="fa fa-phone-alt mr-2" aria-hidden="true"></i><a class="text-white" href="tel:{{ replaceRE "[^0-9+]" "" .Site.Params.contact.phone }}">{{ .Site.Params.contact.phone }}</a></small>
                    <small class="px-3">|</small>
                    <small><i class="fa fa-envelope mr-2" aria-hidden="true"></i><a class="text-white" href="mailto:{{ .Site.Params.contact.email }}">{{ .Site.Params.contact.email }}</a></small>
                </div>
            </div>
        </div>
    </div>
    <!-- Topbar End -->
