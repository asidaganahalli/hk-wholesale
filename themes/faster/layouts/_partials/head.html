<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport">
<meta name="theme-color" content="#1f1f2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HK Wholesale">
<link rel="manifest" href="{{ "site.webmanifest" | relURL }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ "img/icons/apple-touch-icon.png" | relURL }}?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="{{ "img/icons/icon-192.png" | relURL }}?v=2">
{{ if .IsHome }}
<title>{{ .Site.Title }} | New Jersey Wholesale Distribution</title>
<meta name="description" content="{{ .Site.Params.hero.description }}">
{{ else }}
<title>{{ .Title }} | {{ .Site.Title }}</title>
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
{{ end }}

<!-- Google Web Fonts -->
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

<!-- Libraries Stylesheet -->
<link href="{{ "lib/owlcarousel/assets/owl.carousel.min.css" | relURL }}" rel="stylesheet">

<!-- Main CSS File -->
<link href="{{ "css/style.css" | relURL }}" rel="stylesheet">
