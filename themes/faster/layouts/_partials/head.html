<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
{{ if .IsHome }}
<title>{{ .Site.Title }} | New Jersey Wholesale Distribution</title>
<meta name="description" content="{{ .Site.Params.hero.description }}">
{{ else }}
<title>{{ .Title }} | {{ .Site.Title }}</title>
<meta name="description" content="{{ .Description | default .Site.Params.description }}">
{{ end }}

<!-- Google Web Fonts -->
<link rel="preconnect" href="https://fonts.gstatic.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap"
    rel="stylesheet">

<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">

<!-- Libraries Stylesheet -->
<link href="{{ "lib/owlcarousel/assets/owl.carousel.min.css" | relURL }}" rel="stylesheet">

<!-- Main CSS File -->
<link href="{{ "css/style.css" | relURL }}" rel="stylesheet">
